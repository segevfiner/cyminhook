name: Wheels

on:
  push:
    branches:
    - main
    tags:
    - 'v[0-9].*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build sdist
        if: matrix.os == 'windows-2022'
        run: |
          pip install build
          python -m build --sdist

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_SKIP: 'pp*'
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/cyminhook/

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish release distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
